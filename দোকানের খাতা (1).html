<style>
/* Layout: one narrow column like a ledger book. Header with shop name, entry shortcuts,
   a ruled "খাতা" statement ending in a double-underlined net figure, then lists.
   Five tabs pinned to the bottom for one-thumb use. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#14252A; --muted:#566B70; --line:#D6E0DF; --soft:#E7EEED;
  --accent:#183E8F; --accent-ink:#FFFFFF; --accent-soft:#E3EAF8;
  --good:#17794A; --good-soft:#DDF1E6;
  --bad:#B02A22; --bad-soft:#F9E1DE;
  --warn:#8A5700; --warn-soft:#FBEBCB;
  --scrim:rgba(8,16,18,.5);
  --f-body:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
  --f-disp:'Tiro Bangla','Noto Serif Bengali','Kalpurush',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --ink:#E5EEEE; --muted:#93A8AC; --line:#25363A; --soft:#1D2D31;
    --accent:#8CAEFF; --accent-ink:#0B1530; --accent-soft:#1E2B4A;
    --good:#5ECB91; --good-soft:#163527;
    --bad:#FF8E84; --bad-soft:#3E1D1A;
    --warn:#E8B563; --warn-soft:#3A2D12;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --ink:#E5EEEE; --muted:#93A8AC; --line:#25363A; --soft:#1D2D31;
  --accent:#8CAEFF; --accent-ink:#0B1530; --accent-soft:#1E2B4A;
  --good:#5ECB91; --good-soft:#163527;
  --bad:#FF8E84; --bad-soft:#3E1D1A;
  --warn:#E8B563; --warn-soft:#3A2D12;
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 104px;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.shop{font-family:var(--f-disp);font-size:clamp(18px,6.2vw,28px);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{flex-wrap:wrap}.hd .grow{flex:1 1 100%;order:1}.hd .hd-r{order:2;width:100%;justify-content:flex-start}
[data-pin]{-webkit-text-security:disc;text-security:disc}
.date{color:var(--muted);font-size:14px}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.unitchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--good)}
.chip.warn i{background:var(--warn)}
.chip.demo{background:var(--warn-soft);color:var(--warn)}
.chip.demo i{background:var(--warn)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink)}
.icon-btn.sm{width:36px;height:36px;border:0;background:transparent;color:var(--muted)}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2,.card h3{font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.3}
.pg{font-family:var(--f-disp);font-weight:400;font-size:24px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid2.stack{grid-template-columns:1fr}}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:10px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* form controls */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.fld>.lab{font-size:14px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.in{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:16px}
.in::placeholder{color:var(--muted);opacity:.7}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:14px;min-height:24px}

.pill{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* quick entry */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ftiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ftile{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-width:0;min-height:104px}
.ftile .fl{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ftile .fv{font-family:var(--f-disp);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.ftile small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ftile.neg{background:var(--bad-soft);border-color:transparent}.ftile.neg .fv{color:var(--bad)}
.ftile.ok .fv{color:var(--good)}
.quick button{border:0;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px}
.quick .q-s{background:var(--good-soft);color:var(--good)}
.quick .q-p{background:var(--accent-soft);color:var(--accent)}
.quick .q-e{background:var(--bad-soft);color:var(--bad)}

/* ledger statement */
.ledger{display:flex;flex-direction:column}
.lrow{display:flex;align-items:baseline;gap:6px;padding:9px 0;font-size:16px}
.lrow .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.lrow b{font-weight:600;font-variant-numeric:tabular-nums}
.lrow.minus span:first-child{color:var(--muted)}
.lrow.tot{border-top:1.5px solid var(--ink);margin-top:2px}
.lrow.net{border-top:1.5px solid var(--ink);margin-top:2px;padding-bottom:6px;font-size:19px}
.lrow.net span:first-child{font-family:var(--f-disp);font-size:21px}
.lrow.net b{font-size:24px}
.lrow.net.dbl{border-bottom:5px double var(--ink)}

.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{background:var(--good-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ptile.neg{background:var(--bad-soft)}
.ptile .pl{font-size:13px;color:var(--muted)}
.ptile .pv{font-size:22px;font-variant-numeric:tabular-nums;color:var(--good);font-family:var(--f-disp);font-weight:400;line-height:1.3}
.ptile.neg .pv{color:var(--bad)}
.ptile small{font-size:12px;color:var(--muted)}
@media (max-width:560px){.ptiles{grid-template-columns:1fr 1fr}.ptile.first{grid-column:1/-1}.ptile.first .pv{font-size:32px}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bbox{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--good-soft)}
.bbox.neg{background:var(--bad-soft)}
.bbox.exp{background:var(--warn-soft)}
.bbox .bl{font-size:14px;color:var(--muted)}
.bbox .bv{font-family:var(--f-disp);font-size:30px;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--good);font-weight:400}
.bbox.neg .bv{color:var(--bad)}
.bbox.exp .bv{color:var(--warn)}
.bbox small{font-size:13px;color:var(--muted)}
.cat{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.cbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--warn);border-radius:99px}
.bill-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
#hdr,#view{width:100%;margin:0;min-width:0}
.card{min-width:0}
.row.sb{flex-wrap:wrap}
.rows>li.wrap{flex-wrap:wrap}
.li-actions{flex-basis:100%;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.li-actions:empty{display:none}
.icon-btn{position:relative}
.hd-r{flex-wrap:wrap;justify-content:flex-end}
.bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--bg);font-size:11px;font-weight:700;line-height:19px;text-align:center}
.bbox.neu{background:var(--soft)}
.bbox.neu .bv{color:var(--ink)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:15px;align-self:flex-start}
.backbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:6px 0}
.backbtn2{min-height:44px;padding:0 18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
#lock{width:100%}
.lockbox{max-width:420px;margin:20px auto 0;width:100%}
.lk-err{color:var(--bad);font-size:14px;min-height:20px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;letter-spacing:.06em;text-align:center;padding:16px 8px;border:2px dashed var(--line);border-radius:12px;user-select:all;overflow-wrap:anywhere}
.lk-chk{display:flex;gap:10px;align-items:center;font-size:15px}
.lk-chk input{width:20px;height:20px;flex-shrink:0}
/* stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}

/* bar chart */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bval{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.bar{width:100%;max-width:34px;background:var(--accent);opacity:.4;border-radius:6px 6px 0 0;min-height:3px}
.bcol.today .bar{opacity:1}
.bcol.today .bday{color:var(--ink);font-weight:600}
.bday{font-size:12px;color:var(--muted)}

/* lists */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows>li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0;padding-top:2px}
.rows .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .amt{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .amt small{display:block;font-weight:500;font-size:12px}
.party{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 0;min-height:56px}
.pbox{display:flex;flex-direction:column;gap:12px;padding:4px 0 14px}
.stmt{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.stmt li{display:flex;justify-content:space-between;gap:10px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.warnbox span{font-size:14px;font-weight:500}

/* bill summary */
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srow b{font-variant-numeric:tabular-nums}
.srow.big{font-size:20px;border-top:1.5px solid var(--ink);padding-top:10px;margin-top:2px}
.srow.big span{font-family:var(--f-disp)}
.srow.due.has b{color:var(--warn)}
.srow.due.err b{color:var(--bad);font-size:14px}

/* welcome */
.welcome{gap:14px}
.welcome h2{font-size:26px}
.welcome ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* nav */
.nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);min-height:56px;padding:4px 0}
.nb-i{width:38px;height:30px;border-radius:15px;display:grid;place-items:center}
.nb.on{color:var(--accent);font-weight:600}
.nb.on .nb-i{background:var(--accent-soft)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:22px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;padding-bottom:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div id="hdr"></div>
  <main id="view" class="app" style="gap:16px"></main>
</div>
<nav id="nav" class="nav-wrap" aria-label="প্রধান মেনু"></nav>
<div id="sheet"></div>
<div id="lock"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

/* ---------- demo data (never saved) ---------- */
var _demo=null;
function demoData(){
  if(_demo)return _demo;
  var seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var rows=[['চাল','কেজি',58,65,120,40],['মসুর ডাল','কেজি',105,120,40,15],['সয়াবিন তেল','লিটার',168,180,30,12],['চিনি','কেজি',118,130,35,15],['লবণ','কেজি',38,45,25,10],['গোসলের সাবান','পিস',38,45,40,12],['বিস্কুট','প্যাকেট',22,28,50,20],['চা পাতা','প্যাকেট',85,100,6,8]];
  var P=rows.map(function(a,i){return{id:'dp'+i,name:a[0],unit:a[1],buy:a[2],sell:a[3],open:a[4],min:a[5]};});
  var tx=[],ts=1;
  function dayStr(o){var d=new Date();d.setDate(d.getDate()-o);return ymd(d);}
  var cust=['রহিম মিয়া','সালমা বেগম','করিম স্টোর'],sup=['আলম ট্রেডার্স','হাজী এন্টারপ্রাইজ'];
  for(var o=13;o>=0;o--){
    var date=dayStr(o);
    if(o===12||o===6||o===1){
      var its=[],tot=0;
      [0,2,3,1].forEach(function(pi){var p=P[pi],q=10+Math.floor(rnd()*20);its.push({pid:p.id,name:p.name,unit:p.unit,qty:q,price:p.buy});tot+=q*p.buy;});
      tx.push({id:'dt'+(ts),type:'purchase',date:date,ts:ts++,party:sup[o===6?1:0],items:its,sub:tot,discount:0,total:tot,paid:o===1?Math.round(tot*0.6):tot});
    }
    var n=2+Math.floor(rnd()*3);
    for(var k=0;k<n;k++){
      var cnt=1+Math.floor(rnd()*3),used={},items=[],total=0;
      for(var c=0;c<cnt;c++){
        var pi2=Math.floor(rnd()*P.length);if(used[pi2])continue;used[pi2]=1;
        var p2=P[pi2],q2=1+Math.floor(rnd()*4);
        items.push({pid:p2.id,name:p2.name,unit:p2.unit,qty:q2,price:p2.sell,cost:p2.buy});total+=q2*p2.sell;
      }
      var baki=rnd()<0.25,party=baki?cust[Math.floor(rnd()*cust.length)]:'';
      tx.push({id:'dt'+(ts),type:'sale',date:date,ts:ts++,party:party,items:items,sub:total,discount:0,total:total,paid:baki?Math.round(total*0.4):total});
    }
    if(o===9||o===3)tx.push({id:'dt'+(ts),type:'expense',date:date,ts:ts++,cat:o===9?'দোকান ভাড়া':'বিদ্যুৎ বিল',amount:o===9?3500:640,note:''});
    if(o===4)tx.push({id:'dt'+(ts),type:'pay_in',date:date,ts:ts++,party:cust[0],amount:300});
  }
  _demo={products:P,tx:tx,bills:[{id:'db1',name:'দোকান ভাড়া',amount:3500,day:5},{id:'db2',name:'বিদ্যুৎ বিল',amount:640,day:15},{id:'db3',name:'ইন্টারনেট বিল',amount:500,day:20},{id:'db4',name:'কর্মচারীর বেতন',amount:6000,day:1}]};return _demo;
}

/* ---------- derived model ---------- */
function model(){
  var prods=S.demo?demoData().products:S.products;
  var txs=S.demo?demoData().tx:S.tx;
  var mv={},cust={},sup={},seenC={},seenS={};
  txs.forEach(function(t){
    if(t.type==='sale'){
      (t.items||[]).forEach(function(i){mv[i.pid]=(mv[i.pid]||0)-i.qty;});
      if(t.party){seenC[t.party]=1;cust[t.party]=(cust[t.party]||0)+(t.total-t.paid);}
    }else if(t.type==='purchase'){
      (t.items||[]).forEach(function(i){mv[i.pid]=(mv[i.pid]||0)+i.qty;});
      if(t.party){seenS[t.party]=1;sup[t.party]=(sup[t.party]||0)+(t.total-t.paid);}
    }else if(t.type==='pay_in'){seenC[t.party]=1;cust[t.party]=(cust[t.party]||0)-t.amount;}
    else if(t.type==='pay_out'){seenS[t.party]=1;sup[t.party]=(sup[t.party]||0)-t.amount;}
  });
  return{prods:prods,txs:txs,bills:S.demo?demoData().bills:S.bills,cust:cust,sup:sup,seenC:Object.keys(seenC),seenS:Object.keys(seenS),
    stock:function(p){return (p.open||0)+(mv[p.id]||0);}};
}
function byNew(a,b){return String(b.date||'').localeCompare(String(a.date||''))||((b.ts||0)-(a.ts||0));}
function range(){
  var t=today();
  if(S.period==='today')return[t,t];
  if(S.period==='week'){var d=new Date();d.setDate(d.getDate()-6);return[ymd(d),t];}
  if(S.period==='month')return[t.slice(0,8)+'01',t];
  return['0000-00-00','9999-99-99'];
}
function report(rg0){
  var rg=rg0||range(),r={sales:0,cogs:0,exp:0,purch:0,cashIn:0,cashOut:0,bills:0};
  M.txs.forEach(function(t){
    if(t.date<rg[0]||t.date>rg[1])return;
    if(t.type==='sale'){r.sales+=t.total;r.cogs+=(t.items||[]).reduce(function(a,i){return a+i.qty*(i.cost||0);},0);r.cashIn+=t.paid;r.bills++;}
    else if(t.type==='purchase'){r.purch+=t.total;r.cashOut+=t.paid;}
    else if(t.type==='expense'){r.exp+=t.amount;r.cashOut+=t.amount;}
    else if(t.type==='pay_in')r.cashIn+=t.amount;
    else if(t.type==='pay_out')r.cashOut+=t.amount;
  });
  r.gross=r.sales-r.cogs;r.net=r.gross-r.exp;r.cash=r.cashIn-r.cashOut;return r;
}
function rangeOf(k){
  var t=today();
  if(k==='today')return[t,t];
  if(k==='month')return[t.slice(0,8)+'01',t];
  return['0000-00-00','9999-99-99'];
}
function prodProfit(rg){
  var m={};
  M.txs.forEach(function(t){
    if(t.type!=='sale'||t.date<rg[0]||t.date>rg[1])return;
    (t.items||[]).forEach(function(i){
      var o=m[i.pid]||(m[i.pid]={name:i.name,unit:i.unit,qty:0,rev:0,cost:0});
      o.qty+=i.qty;o.rev+=i.qty*i.price;o.cost+=i.qty*(i.cost||0);
    });
  });
  return Object.keys(m).map(function(k){var o=m[k];o.pid=k;o.profit=o.rev-o.cost;return o;}).sort(function(a,b){return b.profit-a.profit;});
}
function profitBox(){
  var defs=[['today','আজকের লাভ'],['month','এই মাসের লাভ'],['all','মোট লাভ (শুরু থেকে)']];
  return '<section class="card"><div class="row sb"><h2>লাভের বক্স</h2><span class="pill good">নিট</span></div><div class="ptiles">'+defs.map(function(d,i){
    var r=report(rangeOf(d[0])),neg=r.net<-0.004,mg=r.sales>0?Math.round(r.net/r.sales*100):null;

  }).join('')+'</div><p class="sub">নিট লাভ = বিক্রি − বিক্রীত মালের কেনা দাম − খরচ। কেনা দাম ধরা হয় বিক্রির সময়ের দামে।</p></section>';
}

/* ---------- storage ---------- */
async function put(coll,obj){
  await S.ready;
  if(S.mode==='lost'){throw{code:'unavailable'};}
  if(S.mode==='cloud'&&S.db){await S.db.collection(coll).doc(obj.id).set(obj);}
  var arr=coll==='products'?S.products:coll==='bills'?S.bills:coll==='trash'?S.trash:S.tx;
  var i=arr.findIndex(function(x){return x.id===obj.id;});
  if(i>=0)arr[i]=obj;else arr.push(obj);
  saveCache();
}
async function del(coll,id){
  await S.ready;
  if(S.mode==='lost'){throw{code:'unavailable'};}
  if(S.mode==='cloud'&&S.db){await S.db.collection(coll).doc(id).delete();}
  if(coll==='products')S.products=S.products.filter(function(x){return x.id!==id;});
  else if(coll==='bills')S.bills=S.bills.filter(function(x){return x.id!==id;});
  else if(coll==='trash')S.trash=S.trash.filter(function(x){return x.id!==id;});
  else S.tx=S.tx.filter(function(x){return x.id!==id;});
  saveCache();
}
async function guard(fn){
  try{await fn();return true;}
  catch(e){
    console.error(e);
    var c=e&&e.code;
    toast(c==='invalid_argument'?'এই লিংকে লেখার অনুমতি নেই — শুধু দেখা যাবে':c==='quota_exceeded'?'জায়গা ভরে গেছে — ব্যাকআপ নিয়ে পুরনো এন্ট্রি মুছুন':c==='unavailable'?'সংযোগ নেই — পরে আবার চেষ্টা করুন':'সংরক্ষণ করা যায়নি, আবার চেষ্টা করুন');
    return false;
  }
}

  var today=sorted.filter(function(t){return t.date===td;});
  var ts=0,tb=0,te=0;

}

function monthKey(d){return String(d).slice(0,7);}
function catTotals(rg){
  var m={};
  M.txs.forEach(function(t){if(t.type==='expense'&&t.date>=rg[0]&&t.date<=rg[1]){var k=t.cat||'অন্যান্য';m[k]=(m[k]||0)+t.amount;}});
  return Object.keys(m).map(function(k){return{name:k,amt:m[k]};}).sort(function(a,b){return b.amt-a.amt;});
}
function billPaid(b){
  var mk=today().slice(0,7),paid=0;
  M.txs.forEach(function(t){if(t.type==='expense'&&monthKey(t.date)===mk&&(t.bill===b.id||(t.cat||'')===b.name))paid+=t.amount;});
  return paid;
}
function billLate(b){return b.day>0&&new Date().getDate()>b.day&&!(billPaid(b)>0);}
function lateBillsBox(){
  var n=(M.bills||[]).filter(billLate).length;

function longDate(s){
  try{var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'});}catch(e){return s;}
}
function saleProfit(t){return t.total-(t.items||[]).reduce(function(a,i){return a+i.qty*(i.cost||0);},0);}
function histRange(p){
  if(p==='week'){var d=new Date();d.setDate(d.getDate()-6);return[ymd(d),today()];}

}

function renderSheet(){
  var el=$('#sheet');
  if(!S.sheet){el.innerHTML='';return;}
  if(!S.sheetPushed)S.sheetPushed=navPush({t:S.tab,sheet:1});
  el.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+sheetBody()+'</div></div>';
  var f=el.querySelector('input:not([type=file]),select');if(f&&S.sheet.type!=='settings'&&S.sheet.type!=='edittx')setTimeout(function(){try{f.focus();}catch(e){}},30);
}
function closeSheet(){
  var was=S.sheet&&S.sheetPushed;
  S.sheet=null;S.restore=null;S.confirm=null;S.sheetPushed=false;renderSheet();
  if(was){S.skipPop=true;setTimeout(function(){S.skipPop=false;},500);try{history.back();}catch(e){S.skipPop=false;}}
}

/* ---------- render ---------- */
function render(soft){
  if(gateState()!=='ok'){drawGate();return;}
  showApp();
  M=model();
  var ae=document.activeElement;
  if(soft&&ae&&ae.closest&&ae.closest('#view')&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)){chrome();return;}
  chrome();
  var v=S.tab==='home'?viewHome():S.tab==='sale'?viewBill('sale'):S.tab==='purchase'?viewBill('purchase'):S.tab==='book'?viewBook():S.tab==='history'?viewHistory():S.tab==='exp'?viewExp():S.tab==='bin'?viewBin():S.tab==='low'?viewLow():S.tab==='recent'?viewRecent():viewStock();
  $('#view').innerHTML=(S.tab!=='home'?'<div class="backbar"><button class="btn soft backbtn2" data-act="back">'+ic('back',20)+' পিছনে</button></div>':'')+v;
  if(S.sheet&&S.sheet.type==='product'&&soft&&S.confirm){renderSheet();}
}

/* ---------- actions ---------- */
function navPush(st){try{history.pushState(st,'');S.histOK=true;return true;}catch(e){return false;}}
function gotoTab(t){
  if(t!==S.tab){S.stack.push(S.tab);if(S.stack.length>30)S.stack.shift();navPush({t:t});}
  S.tab=t;S.openParty=null;S.confirm=null;S.navId++;render();window.scrollTo(0,0);
}
function localBack(){
  var t=S.stack.pop()||'home';
  S.tab=t;S.openParty=null;S.confirm=null;S.navId++;render();window.scrollTo(0,0);
}
function goBack(){
  if(S.sheet){closeSheet();return;}
  if(!S.stack.length){if(S.tab!=='home')localBack();return;}
  if(S.histOK){
    var before=S.navId;
    try{history.back();}catch(e){}
    setTimeout(function(){if(S.navId===before)localBack();},300);
  }else localBack();
}
window.addEventListener('popstate',function(e){
  if(S.skipPop){S.skipPop=false;return;}
  S.navId++;
  var st=e.state||{};
  if(S.recover){S.recover=false;S.recPushed=false;render();return;}
  if(S.sheet){S.sheet=null;S.sheetPushed=false;S.restore=null;S.confirm=null;renderSheet();return;}
  var t=st.t||'home';if(t==='rec')t='home';
  if(t==='home'&&S.tab==='home'){
    if(S.exitArm){S.exitArm=false;try{history.back();}catch(e){}return;}
    S.exitArm=true;navPush({t:'home',s:1});toast('বেরিয়ে যেতে আবার ব্যাক চাপুন',2000);
    setTimeout(function(){S.exitArm=false;},2000);return;
  }
  if(t!==S.tab){
    if(S.stack.length&&S.stack[S.stack.length-1]===t)S.stack.pop();
    S.tab=t;S.openParty=null;S.confirm=null;render();window.scrollTo(0,0);
  }
});
function addLine(kind){
  var d=D[kind],isS=kind==='sale';
  var p=M.prods.find(function(x){return x.id===d.pid;});
  if(!p)return toast('আগে পণ্য বেছে নিন');
  var qty=num(d.qty),price=num(d.price);
  if(qty<=0)return toast('পরিমাণ লিখুন');
  if(String(d.price).trim()==='')return toast('দাম লিখুন');
  if(isS){
    var inCart=d.lines.filter(function(l){return l.pid===p.id;}).reduce(function(a,l){return a+l.qty;},0);
    var left=M.stock(p)-inCart;
    if(qty>left)toast('স্টকে মাত্র '+fmt(Math.max(left,0))+' '+p.unit+' আছে — তবুও যোগ হয়েছে');
  }
  var ex=d.lines.find(function(l){return l.pid===p.id&&l.price===price;});
  if(ex)ex.qty+=qty;else d.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:qty,price:price,cost:p.buy||0});
  d.pid='';d.qty='1';d.price='';
  render();
  var f=$('#f-pid');if(f)f.focus();
}
async function saveBill(kind){
  if(S.demo)return demoBlock();
  var d=D[kind],isS=kind==='sale';
  if(!d.lines.length)return toast('আগে অন্তত একটি পণ্য যোগ করুন');
  var t=totals(kind),party=d.party.trim();
  if(t.paid<0)return toast('টাকার পরিমাণ ঠিক করুন');
  if(t.due<-0.004)return toast('জমা টাকা মোট টাকার বেশি হতে পারে না');
  if(t.due>0.004&&!party)return toast(isS?'বাকি রাখলে কাস্টমারের নাম দিন':'বাকি রাখলে সাপ্লায়ারের নাম দিন');
  var rec={id:uid(),type:kind,date:d.date||today(),ts:Date.now(),party:party,
    items:d.lines.map(function(l){var o={pid:l.pid,name:l.name,unit:l.unit,qty:l.qty,price:l.price};if(isS)o.cost=l.cost;return o;}),
    sub:t.sub,discount:t.disc,total:t.total,paid:t.paid};
  var ok=await guard(async function(){
    await put('tx',rec);
    if(!isS){
      var last={};d.lines.forEach(function(l){last[l.pid]=l.price;});
      for(var pid in last){
        var p=S.products.find(function(x){return x.id===pid;});
        if(p&&p.buy!==last[pid])await put('products',Object.assign({},p,{buy:last[pid]}));
      }
    }
  });
  if(!ok)return;
  D[kind]=Object.assign(newDraft(),{date:d.date});
  render();
  toast((isS?'বিক্রি সংরক্ষিত — ':'কেনা সংরক্ষিত — ')+money(t.total)+(t.due>0.004?', বাকি '+money(t.due):''));
}

  if(!name)return toast('পণ্যের নাম লিখুন');

function calcEdit(et,dom){
  var items=(et.items||[]).map(function(it,i){
    return Object.assign({},it,{qty:dom?num(($('#ed-q'+i)||{}).value):it.qty,price:dom?num(($('#ed-p'+i)||{}).value):it.price});
  }).filter(function(it){return it.qty>0;});
  var sub=items.reduce(function(a,l){return a+l.qty*l.price;},0);
  var disc=dom?Math.min(Math.max(num(($('#ed-disc')||{}).value),0),sub):Math.min(et.discount||0,sub);
  var total=sub-disc,pe=dom?$('#ed-paid'):null;
  var auto=!!(pe&&!pe.dataset.touched&&et.paid>=et.total-0.004);
  var paid=dom?(auto?total:num((pe||{}).value)):et.paid;
  return{items:items,sub:sub,disc:disc,total:total,paid:paid,due:total-paid};
}

var LSA='dokan-khata-auth',REMEMBER_MS=30*86400000;
function normDigits(s){return String(s==null?'':s).replace(/[০-৯]/g,function(d){return '০১২৩৪৫৬৭৮৯'.indexOf(d);});}
function normPhone(s){
  var d=normDigits(s).replace(/\D/g,'');
  if(d.indexOf('880')===0)d='0'+d.slice(3);
  if(d.length===10&&d.charAt(0)==='1')d='0'+d;
  return d;
}
function phoneOk(p){return /^01[3-9]\d{8}$/.test(p);}
function maskPhone(p){return p?p.slice(0,3)+'****'+p.slice(-3):'';}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function rndBytes(n){var u=new Uint8Array(n);crypto.getRandomValues(u);return u;}
function cyrb(str,seed){var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
async function hashSecret(secret,saltB64){
  try{
    if(window.crypto&&crypto.subtle){
      var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:120000,hash:'SHA-256'},key,256);
      return 'p:'+b64e(new Uint8Array(bits));
    }
  }catch(e){}
  var x=secret+'|'+saltB64;for(var i=0;i<20000;i++)x=cyrb(x,i);
  return 'f:'+x;
}
function newCode(){
  var al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=rndBytes(10),s='';
  for(var i=0;i<10;i++){s+=al.charAt(r[i]%al.length);if(i===4)s+='-';}
  return s;
}
function codeNorm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function readAuthCache(){try{return JSON.parse(localStorage.getItem(LSA)||'null');}catch(e){return null;}}
async function saveAuth(doc){
  await S.ready;
  if(S.mode==='cloud'&&S.db)await S.db.doc('settings/auth').set(doc);
  try{localStorage.setItem(LSA,JSON.stringify(doc));}catch(e){}
}
function getFail(){try{return JSON.parse(localStorage.getItem('dk-fail')||'{}')||{};}catch(e){return {};}}
function setFail(o){try{localStorage.setItem('dk-fail',JSON.stringify(o));}catch(e){}}
function startSession(doc,remember){
  S.unlocked=true;S.remember=!!remember;S.recover=false;
  var tok=doc.hash.slice(0,24);
  try{sessionStorage.setItem('dk-s',tok);}catch(e){}
  try{if(remember)localStorage.setItem('dk-r',JSON.stringify({h:tok,until:Date.now()+REMEMBER_MS}));else localStorage.removeItem('dk-r');}catch(e){}
  try{localStorage.setItem('dk-phone',doc.phone);}catch(e){}
}
function tryRestore(){
  if(S.unlocked||!S.auth)return;
  var tok=S.auth.hash.slice(0,24);
  try{if(sessionStorage.getItem('dk-s')===tok){S.unlocked=true;return;}}catch(e){}
  try{
    var r=JSON.parse(localStorage.getItem('dk-r')||'null');
    if(r&&r.h===tok&&r.until>Date.now()){S.unlocked=true;S.remember=true;}
  }catch(e){}
}
function gateState(){
  if(!S.authReady)return 'loading';
  if(S.newCode)return 'code';
  if(!S.auth)return 'setup';
  return S.unlocked?'ok':(S.recover?'recover':'login');
}

function lkErr(m){var e=$('#lk-err')||$('#cp-err');if(e)e.textContent=m;}
function lockedMsg(){
  var f=getFail();
  if(f.until&&f.until>Date.now()){lkErr('অনেকবার ভুল হয়েছে। '+fmt(Math.ceil((f.until-Date.now())/1000))+' সেকেন্ড পরে আবার চেষ্টা করুন');return true;}
  return false;
}
function failOnce(){
  var f=getFail(),n=(f.n||0)+1,until=n>=5?Date.now()+Math.min(600000,30000*(n-4)):0;
  setFail({n:n,until:until});
  return n;
}
async function doSetup(){
  var shop=$('#lk-shop').value.trim(),phone=normPhone($('#lk-phone').value),p1=normDigits($('#lk-pin').value),p2=normDigits($('#lk-pin2').value);
  if(!shop)return lkErr('দোকানের নাম লিখুন');
  if(!phoneOk(phone))return lkErr('সঠিক মোবাইল নাম্বার লিখুন (যেমন 01712345678)');
  if(!/^\d{4,6}$/.test(p1))return lkErr('পিন ৪ থেকে ৬ সংখ্যার হতে হবে');
  if(p1!==p2)return lkErr('দুটি পিন মেলেনি');
  lkErr('');
  var salt=b64e(rndBytes(16)),rsalt=b64e(rndBytes(16)),code=newCode();
  var doc={phone:phone,salt:salt,hash:await hashSecret(p1+':'+phone,salt),rsalt:rsalt,rhash:await hashSecret(codeNorm(code)+':'+phone,rsalt),createdAt:Date.now()};
  var ok=await guard(async function(){await saveAuth(doc);if(shop!==S.shop.name)await saveShopName(shop);});
  if(!ok)return;
  S.auth=doc;startSession(doc,true);S.newCode=code;render();
}
async function doLogin(){
  if(lockedMsg())return;
  var phone=normPhone($('#lk-phone').value),pin=normDigits($('#lk-pin').value);
  if(!phone||!pin)return lkErr('মোবাইল নাম্বার ও পিন লিখুন');
  lkErr('');
  var ok=phone===S.auth.phone&&(await hashSecret(pin+':'+S.auth.phone,S.auth.salt))===S.auth.hash;
  if(!ok){
    var n=failOnce();
    if(n>=5){lockedMsg();return;}
    return lkErr('মোবাইল নাম্বার বা পিন ভুল। আর '+fmt(5-n)+' বার চেষ্টা করা যাবে');
  }
  setFail({});startSession(S.auth,$('#lk-rem').checked);render();
}
async function doRecover(){
  if(lockedMsg())return;
  var phone=normPhone($('#lk-phone').value),code=codeNorm($('#lk-code-in').value),p1=normDigits($('#lk-pin').value),p2=normDigits($('#lk-pin2').value);
  if(!phone||!code)return lkErr('মোবাইল নাম্বার ও রিকভারি কোড লিখুন');
  if(!/^\d{4,6}$/.test(p1))return lkErr('নতুন পিন ৪ থেকে ৬ সংখ্যার হতে হবে');
  if(p1!==p2)return lkErr('দুটি পিন মেলেনি');
  lkErr('');
  var ok=phone===S.auth.phone&&(await hashSecret(code+':'+S.auth.phone,S.auth.rsalt))===S.auth.rhash;
  if(!ok){
    var n=failOnce();
    if(n>=5){lockedMsg();return;}
    return lkErr('নাম্বার বা রিকভারি কোড ভুল। আর '+fmt(5-n)+' বার চেষ্টা করা যাবে');
  }
  var salt=b64e(rndBytes(16)),rsalt=b64e(rndBytes(16)),nc=newCode();
  var doc=Object.assign({},S.auth,{salt:salt,hash:await hashSecret(p1+':'+S.auth.phone,salt),rsalt:rsalt,rhash:await hashSecret(codeNorm(nc)+':'+S.auth.phone,rsalt)});
  var saved=await guard(function(){return saveAuth(doc);});
  if(!saved)return;
  setFail({});S.auth=doc;startSession(doc,true);S.newCode=nc;render();
}
async function doChangePin(){

  if(n1!==n2)return lkErr('দুটি নতুন পিন মেলেনি');

  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='scrim'){if(e.target===el)closeSheet();return;}
  act(el.dataset.act,el);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id&&t.id.indexOf('ed-')===0){if(t.id==='ed-paid')t.dataset.touched='1';updateEditSum();return;}
  if(t.id==='hist-q'){S.hf.q=t.value;S.hf.n=60;var hb=$('#hist-body');if(hb)hb.innerHTML=viewHistory(true);return;}
  if(t.id==='stock-q'){S.stockQ=t.value;var sl=$('#stock-list');if(sl)sl.innerHTML=viewStock(true);return;}
  var k=t.dataset&&t.dataset.k,f=t.dataset&&t.dataset.d;
  if(!k||!f||!D[k])return;
  D[k][f]=t.value;
  if(f==='discount'||f==='paid')updateSum(k);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-pid'){
    var k=t.dataset.k,p=M.prods.find(function(x){return x.id===t.value;});
    D[k].pid=t.value;
    if(p){D[k].price=plain(k==='sale'?p.sell:p.buy);var pr=$('#f-price');if(pr)pr.value=D[k].price;}
  }
  if(t.id==='rs-file'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        var ps=(j.products||[]).filter(function(x){return x&&typeof x.id==='string'&&x.name;});
        var ts=(j.tx||[]).filter(function(x){return x&&typeof x.id==='string'&&x.type;});
        if(!ps.length&&!ts.length)throw 0;
        S.restore={products:ps,tx:ts,bills:(j.bills||[]).filter(function(x){return x&&typeof x.id==='string'&&x.name;}),shop:j.shop||null};renderSheet();
      }catch(x){toast('এটি দোকানের খাতার ব্যাকআপ ফাইল নয়');}
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#lock')){e.preventDefault();var pb=$('#lock [data-primary]');if(pb)pb.click();return;}
  if(e.key==='Escape'&&S.sheet){closeSheet();return;}
  if(e.key==='Enter'&&(e.target.id==='f-qty'||e.target.id==='f-price')){e.preventDefault();addLine(e.target.dataset.k);}
});

/* ---------- boot ---------- */
function subscribe(){
  function onErr(e){console.error(e);S.mode='lost';chrome();toast('অনলাইন সংযোগ বন্ধ হয়েছে — পাতাটি আবার খুলুন');}
  S.db.collection('products').onSnapshot(function(s){S.products=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});saveCache();render(true);},onErr);
  S.db.collection('tx').onSnapshot(function(s){S.tx=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});saveCache();render(true);},onErr);
  S.db.collection('bills').onSnapshot(function(s){S.bills=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});saveCache();render(true);},onErr);
  S.db.doc('settings/auth').onSnapshot(function(s){S.auth=s.exists?s.data():null;S.authReady=true;try{if(S.auth)localStorage.setItem(LSA,JSON.stringify(S.auth));else localStorage.removeItem(LSA);}catch(e){}tryRestore();render();},onErr);
  S.db.collection('trash').onSnapshot(function(s){S.trash=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});saveCache();purgeOld();render(true);},onErr);
  S.db.doc('settings/shop').onSnapshot(function(s){if(s.exists){S.shop=Object.assign({},S.shop,s.data());saveCache();chrome();}},onErr);
}
async function init(){
  loadCache();
  var ca=readAuthCache();if(ca){S.auth=ca;S.authReady=true;tryRestore();}
  render();
  try{history.replaceState({t:'home'},'');navPush({t:'home',s:1});}catch(e){}
  var db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  if(db){S.db=db;S.mode='cloud';subscribe();}else{S.mode='local';S.authReady=true;tryRestore();}
  resolveReady();purgeOld();render();
}
init();
})();
</script>
